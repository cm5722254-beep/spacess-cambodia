services:
  postgres:
    image: postgres:16-alpine
    container_name: spaces-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spaces_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spaces_secret_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-spaces_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spaces_admin} -d ${POSTGRES_DB:-spaces_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: spaces-dev-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: spaces-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-spaces_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-spaces_minio_secret_key_2026}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_dev_data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T19-39-39Z
    container_name: spaces-dev-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY:-spaces_minio_admin} ${S3_SECRET_KEY:-spaces_minio_secret_key_2026};
      /usr/bin/mc mb myminio/${S3_BUCKET_NAME:-spaces-media} || true;
      /usr/bin/mc anonymous set download myminio/${S3_BUCKET_NAME:-spaces-media} || true;
      exit 0;
      "

volumes:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data:

