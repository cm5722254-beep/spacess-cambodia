services:
  caddy:
    image: caddy:2-alpine
    container_name: spaces-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - spaces-network

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    container_name: spaces-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      INSTANCE_MODE: ${INSTANCE_MODE:-mixed}
      DATABASE_URL: postgresql://${POSTGRES_USER:-spaces_admin}:${POSTGRES_PASSWORD:-spaces_secret_pass_2026}@postgres:5432/${POSTGRES_DB:-spaces_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${APP_URL:-http://localhost}/storage
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-spaces_minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-spaces_minio_secret_key_2026}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-spaces-media}
      S3_FORCE_PATH_STYLE: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - spaces-network

  postgres:
    image: postgres:16-alpine
    container_name: spaces-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spaces_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spaces_secret_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-spaces_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spaces_admin} -d ${POSTGRES_DB:-spaces_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spaces-network

  redis:
    image: redis:7-alpine
    container_name: spaces-redis
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spaces-network

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: spaces-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-spaces_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-spaces_minio_secret_key_2026}
    volumes:
      - minio_prod_data:/data
    networks:
      - spaces-network

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T19-39-39Z
    container_name: spaces-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY:-spaces_minio_admin} ${S3_SECRET_KEY:-spaces_minio_secret_key_2026};
      /usr/bin/mc mb myminio/${S3_BUCKET_NAME:-spaces-media} || true;
      /usr/bin/mc anonymous set download myminio/${S3_BUCKET_NAME:-spaces-media} || true;
      exit 0;
      "
    networks:
      - spaces-network

networks:
  spaces-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:

