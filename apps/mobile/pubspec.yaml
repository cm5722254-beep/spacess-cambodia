name: spaces_mobile
description: "Spaces Social Media App - iOS Cupertino style with Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking & Realtime
  dio: ^5.8.0+1
  socket_io_client: ^3.0.2

  # Secure Storage & Cache
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2

  # Push Notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4

  # UI & iOS styling
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/
    - assets/icons/
    - assets/images/
    - assets/images/

